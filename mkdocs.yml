site_name: PyTorch Learning Hub
site_description: Practical PyTorch notes, visual explanations, and original projects by Daniel Zurita.
site_url: https://pytorch.dazu.xyz/
repo_name: danielmza-web/pytorch-learning-hub

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/dz-pytorch-mark.png
  favicon: assets/images/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/recall-visuals.css
  - assets/stylesheets/course3-visuals.css

extra_javascript:
  - assets/javascripts/copy-code.js
  - assets/javascripts/interactions.js
  - assets/javascripts/recall-visuals.js
  - assets/javascripts/course3-visuals.js

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Start here: index.md
  - 1 · Learn the fundamentals:
      - 1.1 · Build and train: guides/fundamentals/core-workflow.md
      - 1.2 · Images and CNNs: guides/fundamentals/vision-real-data.md
  - 2 · Improve training:
      - 2.1 · Metrics and tuning: guides/training/training-quality.md
      - 2.2 · Efficient pipelines: guides/training/efficient-training.md
  - 3 · Work with vision:
      - 3.1 · Data, transforms and noise: guides/vision/augmentation.md
      - 3.2 · Pretrained models: guides/vision/pretrained-models.md
  - 4 · Work with text:
      - 4.1 · Tokens and embeddings: guides/text/tokens-embeddings.md
      - 4.2 · Classifiers and fine-tuning: guides/text/text-classifiers.md
  - 5 · Explore advanced architectures:
      - 5.1 · Vision, similarity and generation: guides/architectures/vision-generative.md
      - 5.2 · Attention and transformers: guides/architectures/transformers.md
  - 6 · Save and deploy models:
      - 6.1 · Memory, checkpoints and tracking: guides/deployment/model-lifecycle.md
      - 6.2 · Compression, export and deployment: guides/deployment/optimization-serving.md
  - Practice with projects:
      - Choose a project: projects/index.md
      - P1 · Nonlinear regression: projects/regression.md
      - P2 · EMNIST letters: projects/emnist.md
      - P3 · Robust image pipeline: projects/robust-image-pipeline.md
      - P4 · Nature CNN: projects/nature-cnn.md
      - P5 · Controlled training comparison: projects/training-comparison.md
      - P6 · Image augmentation and head training: projects/vision-head.md
      - P7 · Variable-length text classifier: projects/text-bags.md
      - P8 · Model lifecycle and pruning: projects/model-lifecycle.md
  - Quick reference: reference/index.md
  - About this library: about/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/danielmza-web
    - icon: fontawesome/solid/globe
      link: https://dazu.xyz/
  generator: false

copyright: Built as an original learning reference · <a href="https://dazu.xyz/learn/pytorch/">Quick summary</a> · <a href="https://dazu.xyz/">DaZu</a>
