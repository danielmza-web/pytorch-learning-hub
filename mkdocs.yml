site_name: PyTorch Learning Hub
site_description: Practical PyTorch notes, visual explanations, and original projects by Daniel Zurita.
site_url: https://pytorch.dazu.xyz/
repo_name: danielmza-web/pytorch-learning-hub

theme:
  name: material
  language: en
  logo: assets/images/dz-pytorch-mark.png
  favicon: assets/images/dz-pytorch-mark.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/recall-visuals.css

extra_javascript:
  - assets/javascripts/interactions.js
  - assets/javascripts/recall-visuals.js

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Start here: index.md
  - Learn the fundamentals:
      - 1 · Build and train: guides/fundamentals/core-workflow.md
      - 2 · Images and CNNs: guides/fundamentals/vision-real-data.md
  - Improve training:
      - 1 · Metrics and tuning: guides/training/training-quality.md
      - 2 · Efficient pipelines: guides/training/efficient-training.md
  - Work with vision:
      - 1 · Data, transforms and noise: guides/vision/augmentation.md
      - 2 · Pretrained models: guides/vision/pretrained-models.md
  - Work with text:
      - 1 · Tokens and embeddings: guides/text/tokens-embeddings.md
      - 2 · Classifiers and fine-tuning: guides/text/text-classifiers.md
  - Practice with projects:
      - Choose a project: projects/index.md
      - Controlled training comparison: projects/training-comparison.md
      - Image augmentation and head training: projects/vision-head.md
      - Variable-length text classifier: projects/text-bags.md
      - Nonlinear regression: projects/regression.md
      - EMNIST letters: projects/emnist.md
      - Robust image pipeline: projects/robust-image-pipeline.md
      - Nature CNN: projects/nature-cnn.md
  - Quick reference: reference/index.md
  - About this library: about/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/danielmza-web
    - icon: fontawesome/solid/globe
      link: https://dazu.xyz/
  generator: false

copyright: Built as an original learning reference · <a href="https://dazu.xyz/learn/pytorch/">Quick summary</a> · <a href="https://dazu.xyz/">DaZu</a>
